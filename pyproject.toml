[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "codex-chatgpt-mcp-proxy"
version = "0.1.0"
description = "Outbound-only durable bridge between MCP and a local Codex App Server"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp==2.3.0", "fastapi==0.143.1", "httpx==0.28.1", "uvicorn==0.54.0", "pyjwt[crypto]==2.15.1"]

[project.scripts]
codex-bridge = "codex_chatgpt_mcp_proxy.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/codex_chatgpt_mcp_proxy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
